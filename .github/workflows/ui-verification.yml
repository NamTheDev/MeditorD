name: MeditorD UI verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-tests:
    name: Bun unit and source tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/*.test.js

  browser-tests:
    name: Chromium and Firefox on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Install browser test runner and browsers
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Run UI tests against Bun server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 HOST=127.0.0.1 bun run index.ts >/tmp/meditord-ui-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..35}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/archive.html; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/meditord-ui-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/archive.html >/dev/null
          node --test tests/ui-browser.test.mjs
      - name: Upload browser screenshots and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meditord-ui-browser-evidence
          path: |
            test-results/ui/*.png
            /tmp/meditord-ui-server.log
          if-no-files-found: ignore

  browser-container-tests:
    name: Chromium and Firefox in Playwright container
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun setup prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install JavaScript runner matching the container browsers
        run: npm install --no-save --ignore-scripts --legacy-peer-deps playwright@1.56.1
      - name: Run UI tests against Bun server in container
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          PORT=3000 HOST=127.0.0.1 bun run index.ts >/tmp/meditord-ui-container.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..35}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/archive.html; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/meditord-ui-container.log
              exit 1
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/archive.html >/dev/null
          node --test tests/ui-browser.test.mjs
      - name: Upload container browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meditord-ui-container-evidence
          path: |
            test-results/ui/*.png
          if-no-files-found: ignore
