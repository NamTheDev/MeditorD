name: Temporary final cache validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit --pretty false
      - run: node --check public/sw.js
      - run: node --check public/js/archive.js
      - run: git diff --check 301b6c9df50524f33cbc579dde0246540f1053c0 HEAD
      - name: Smoke test server
        run: |
          bun run index.ts > /tmp/meditord.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/archive.html >/tmp/archive.html; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:3000/archive.html >/tmp/archive.html
          curl --fail --silent http://127.0.0.1:3000/database.html >/dev/null
          curl --fail --silent http://127.0.0.1:3000/sw.js >/tmp/sw.js
          grep -q "serviceWorker" /tmp/archive.html
          grep -q "meditord-pages-" /tmp/sw.js
