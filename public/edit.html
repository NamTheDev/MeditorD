<header>
    <nav aria-label="Editor navigation">
        <a
            href="/home.html"
            class="compartment arrow-compartment"
            aria-label="Go back"
        >
            <span class="editor-back-symbol" aria-hidden="true">←</span>
        </a>
        <div class="title-compartment">EDITOR</div>
        <div class="editor-nav-actions">
            <div class="compartment editor-save-compartment">
                <button type="button" class="action-btn" id="save-button">Save</button>
            </div>
            <div class="compartment editor-archive-compartment">
                <button type="button" class="action-btn" id="archive-button">Archive</button>
            </div>
            <div class="compartment editor-reset-compartment">
                <button type="button" class="action-btn" id="reset-button">Reset</button>
            </div>
        </div>
    </nav>
</header>
<main class="editor-container">
    <div class="editor-layout" id="editor-layout">
        <div class="editor-left-pane">
            <form class="editor-form">
                <div class="form-row">
                    <label for="doc-title" class="field-label">Title:</label>
                    <input
                        type="text"
                        id="doc-title"
                        class="form-control-unit"
                        placeholder="Enter title..."
                    />
                </div>

                <div class="form-row">
                    <label for="doc-folder" class="field-label">Folder:</label>
                    <span class="win98-select form-control-unit">
                        <select id="doc-folder" aria-label="Post folder">
                            <option value="">(Unfiled)</option>
                        </select>
                    </span>
                </div>

                <div class="form-row">
                    <label for="doc-username" class="field-label"
                        >Username:</label
                    >
                    <input
                        type="text"
                        id="doc-username"
                        class="form-control-unit"
                        placeholder="Enter username..."
                    />
                </div>

                <div class="form-row">
                    <label for="doc-url" class="field-label">URL:</label>
                    <input
                        type="text"
                        id="doc-url"
                        class="form-control-unit"
                        placeholder="https://example.com"
                    />
                </div>

                <div class="form-row">
                    <label class="field-label" for="doc-media">Media:</label>
                    <input type="file" id="doc-media" class="hidden" />
                    <label for="doc-media" class="upload-btn form-control-unit"
                        >Upload File</label
                    >
                </div>

                <div class="form-row preview-row">
                    <label class="field-label">Preview:</label>
                    <div class="preview-box form-control-unit">
                        No Media Selected
                    </div>
                </div>
            </form>
        </div>

        <div class="editor-right-pane">
            <div class="textarea-wrapper">
                <div class="description-toolbar">
                    <span class="description-label">Description:</span>
                    <div
                        class="mobile-view-switch"
                        role="tablist"
                        aria-label="Description view"
                    >
                        <button
                            type="button"
                            class="mobile-view-tab active"
                            id="write-view-button"
                            role="tab"
                            aria-selected="true"
                        >
                            Write
                        </button>
                        <button
                            type="button"
                            class="mobile-view-tab"
                            id="preview-view-button"
                            role="tab"
                            aria-selected="false"
                        >
                            Preview
                        </button>
                    </div>
                    <button
                        type="button"
                        class="action-btn"
                        id="preview-button"
                    >
                        Preview
                    </button>
                </div>
                <textarea
                    class="editor-textarea"
                    placeholder="Start typing..."
                ></textarea>
                <div class="markdown-preview hidden" aria-live="polite"></div>
                <div
                    class="mobile-markdown-toolbar"
                    role="toolbar"
                    aria-label="Markdown formatting"
                >
                    <button type="button" data-markdown-action="heading">
                        #
                    </button>
                    <button type="button" data-markdown-action="bold">B</button>
                    <button type="button" data-markdown-action="italic">
                        I
                    </button>
                    <button type="button" data-markdown-action="code">`</button>
                    <button type="button" data-markdown-action="list">−</button>
                    <button type="button" data-markdown-action="link">
                        Link
                    </button>
                </div>
            </div>
        </div>
    </div>

</main>

<div
    class="win98-modal-backdrop hidden"
    id="feature-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="feature-modal-title"
>
    <section class="win98-modal">
        <header class="win98-modal-titlebar">
            <h2 id="feature-modal-title"></h2>
            <button
                type="button"
                class="win98-modal-close"
                aria-label="Close dialog"
            >
                X
            </button>
        </header>

        <div class="win98-modal-content">
            <div class="win98-info-icon" aria-hidden="true">i</div>
            <p id="feature-modal-message"></p>
        </div>

        <footer class="win98-modal-actions">
            <button type="button" class="win98-button win98-default">OK</button>
        </footer>
    </section>
</div>

<script src="/js/media-thumbnail.js" defer></script>
<script src="/js/document-api.js" defer></script>
<script src="/js/url-validation.js" defer></script>
<script src="/vendor/markdown-it.js?v=15.0.2" defer></script>
<script src="/js/edit.js" defer></script>
