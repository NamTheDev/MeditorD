<div id="fullscreenApp">
<header>
    <nav aria-label="Editor navigation">
        <a
            href="/home.html"
            class="editor-compartment editor-arrow-compartment"
            aria-label="Home"
        >
            Home
        </a>
        <div class="editor-title-compartment">EDITOR</div>
        <div class="editor-nav-actions">
            <div class="editor-compartment editor-save-compartment">
                <button type="button" class="global-action-button" id="save-button">Save</button>
            </div>
            <div class="editor-compartment editor-archive-compartment">
                <button type="button" class="global-action-button" id="archive-button">Archive</button>
            </div>
            <div class="editor-compartment editor-reset-compartment">
                <button type="button" class="global-action-button" id="reset-button">Reset</button>
            </div>
        </div>
    </nav>
</header>
<main class="editor-container">
    <div class="editor-layout" id="editor-layout">
        <div class="editor-left-pane">
            <form class="editor-form">
                <div class="editor-form-row">
                    <label for="doc-title" class="editor-field-label">Title:</label>
                    <input
                        type="text"
                        id="doc-title"
                        class="editor-form-control"
                        placeholder="Enter title..."
                    />
                </div>

                <div class="editor-form-row">
                    <label for="doc-folder" class="editor-field-label">Folder:</label>
                    <span class="global-select editor-form-control">
                        <select id="doc-folder" aria-label="Post folder">
                            <option value="">(Unfiled)</option>
                        </select>
                    </span>
                </div>

                <div class="editor-form-row">
                    <label for="doc-username" class="editor-field-label"
                        >Username:</label
                    >
                    <input
                        type="text"
                        id="doc-username"
                        class="editor-form-control"
                        placeholder="Enter username..."
                    />
                </div>

                <div class="editor-form-row">
                    <label for="doc-url" class="editor-field-label">URL:</label>
                    <input
                        type="text"
                        id="doc-url"
                        class="editor-form-control"
                        placeholder="https://example.com"
                    />
                </div>

                <div class="editor-form-row">
                    <label class="editor-field-label" for="doc-media">Media:</label>
                    <input type="file" id="doc-media" class="global-hidden" />
                    <label for="doc-media" class="editor-upload-button editor-form-control"
                        >Upload File</label
                    >
                </div>

                <div class="editor-form-row editor-preview-row">
                    <label class="editor-field-label">Preview:</label>
                    <div class="editor-preview-box editor-form-control">
                        No Media Selected
                    </div>
                </div>
            </form>
        </div>

        <div class="editor-right-pane">
            <div class="editor-textarea-wrapper">
                <div class="editor-description-toolbar">
                    <span class="editor-description-label">Description:</span>
                    <div
                        class="editor-mobile-view-switch"
                        role="tablist"
                        aria-label="Description view"
                    >
                        <button
                            type="button"
                            class="editor-mobile-view-tab active"
                            id="write-view-button"
                            role="tab"
                            aria-selected="true"
                        >
                            Write
                        </button>
                        <button
                            type="button"
                            class="editor-mobile-view-tab"
                            id="preview-view-button"
                            role="tab"
                            aria-selected="false"
                        >
                            Preview
                        </button>
                    </div>
                    <button
                        type="button"
                        class="global-action-button"
                        id="preview-button"
                    >
                        Preview
                    </button>
                </div>
                <textarea
                    class="editor-textarea"
                    placeholder="Start typing..."
                ></textarea>
                <div class="editor-markdown-preview global-hidden" aria-live="polite"></div>
                <div
                    class="editor-mobile-markdown-toolbar"
                    role="toolbar"
                    aria-label="Markdown formatting"
                >
                    <button type="button" data-markdown-action="heading">
                        #
                    </button>
                    <button type="button" data-markdown-action="bold">B</button>
                    <button type="button" data-markdown-action="italic">
                        I
                    </button>
                    <button type="button" data-markdown-action="code">`</button>
                    <button type="button" data-markdown-action="list">−</button>
                    <button type="button" data-markdown-action="link">
                        Link
                    </button>
                </div>
            </div>
        </div>
    </div>

</main>
</div>

<div
    class="editor-dialog-backdrop global-hidden"
    id="feature-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="feature-modal-title"
>
    <section class="editor-dialog">
        <header class="editor-dialog-titlebar">
            <h2 id="feature-modal-title"></h2>
            <button
                type="button"
                class="editor-dialog-close"
                aria-label="Close dialog"
            >
                X
            </button>
        </header>

        <div class="editor-dialog-content">
            <div class="editor-dialog-info-icon" aria-hidden="true">i</div>
            <p id="feature-modal-message"></p>
        </div>

        <footer class="editor-dialog-actions">
            <button type="button" class="global-button editor-dialog-default">OK</button>
        </footer>
    </section>
</div>

<script src="/js/media-thumbnail.js" defer></script>
<script src="/js/document-api.js" defer></script>
<script src="/js/url-validation.js" defer></script>
<script src="/vendor/markdown-it.js?v=15.0.2" defer></script>
<script src="/js/edit.js" defer></script>
