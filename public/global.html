<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <title>{{title}}</title>
        <meta name="meditord-build-id" content="{{build_id}}" />
        <link rel="icon" type="image/webp" href="/media/icon.webp" />
        <meta name="color-scheme" content="dark" />
        <meta name="darkreader-lock" />
        <link rel="stylesheet" href="/css/fonts.css" />
        <style>
            html.meditord-js.meditord-cold-shell #appLoadingOverlay {
                display: grid;
            }
            #appLoadingOverlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 2147483640;
                place-content: center;
                justify-items: center;
                gap: 20px;
                background: #1e1e2e;
                color: #cdd6f4;
                font: 600 18px/1.5 system-ui, sans-serif;
                text-align: center;
            }
            /* Covers page content until it can fade in, including after cold starts. */
            #pageTransitionOverlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 2147483630;
                background: #1e1e2e;
                opacity: 1;
                pointer-events: none;
                transition: opacity 150ms ease-in-out;
            }
            html.meditord-js #pageTransitionOverlay {
                display: block;
            }
            html.meditord-page-visible:not(.meditord-cold-shell) #pageTransitionOverlay {
                opacity: 0;
            }
            html.meditord-page-leaving #pageTransitionOverlay {
                opacity: 1;
                pointer-events: auto;
            }
            .app-loading-track {
                width: min(300px, 76vw);
                height: 16px;
                border: 2px solid #585b70;
                background: #11111b;
                padding: 2px;
            }
            .app-loading-fill {
                display: block;
                height: 100%;
                width: 0%;
                background: #b4befe;
                transition: width 160ms linear;
            }
            @media (prefers-reduced-motion: reduce) {
                .app-loading-fill { transition: none; }
                #pageTransitionOverlay { transition: none; }
            }
        </style>
        <script>
            (() => {
                document.documentElement.classList.add("meditord-js");
                const build = document.querySelector('meta[name="meditord-build-id"]')?.content;
                let warm = false;
                try { warm = !!build && localStorage.getItem("meditord-shell-ready") === build; } catch {}
                if (!warm) document.documentElement.classList.add("meditord-cold-shell");
            })();
        </script>
        <script src="/js/app-shell.js" defer></script>
        <script src="/js/page-transition.js" defer></script>
        <link rel="stylesheet" href="/css/global.css" />
        {{page_stylesheet}}
    </head>
    <body>
        <div id="appLoadingOverlay" role="status" aria-live="polite" aria-label="Loading application">
            <span>Loading...</span>
            <div class="app-loading-track" role="progressbar" aria-label="Application loading progress"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="app-loading-fill"></span>
            </div>
        </div>
        <div id="pageTransitionOverlay" aria-hidden="true"></div>
        {{body}}
        <div
            class="app-dialog-overlay"
            id="appDialog"
            role="presentation"
            hidden
        >
            <section
                class="app-dialog-window raised"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="appDialogTitle"
                aria-describedby="appDialogMessage"
            >
                <header class="app-dialog-titlebar">
                    <h2 id="appDialogTitle">Message</h2>
                    <button
                        class="app-dialog-close"
                        id="appDialogClose"
                        type="button"
                        aria-label="Close dialog"
                    >×</button>
                </header>
                <div class="app-dialog-content">
                    <p id="appDialogMessage"></p>
                    <label class="app-dialog-input-wrap" id="appDialogInputWrap" hidden>
                        <span class="app-dialog-visually-hidden" id="appDialogInputLabel">Value</span>
                        <input id="appDialogInput" type="text" />
                    </label>
                    <div class="app-dialog-actions">
                        <button id="appDialogCancel" type="button">Cancel</button>
                        <button id="appDialogConfirm" type="button">OK</button>
                    </div>
                </div>
            </section>
        </div>
        <script src="/js/app-runtime.js"></script>
        <script src="/js/app-dialog.js"></script>
    </body>
</html>
