<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <title>{{title}}</title>
        <meta name="meditord-build-id" content="{{build_id}}" />
        <link rel="icon" type="image/webp" href="/media/icon.webp" />
        <meta name="color-scheme" content="dark" />
        <meta name="darkreader-lock" />
        <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/9d44a92983acf712.woff2" />
        <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/c4f4a8cd0b92a14a.woff2" />
        <link rel="stylesheet" href="/css/fonts.css" />
        <style>
            html.meditord-js.meditord-cold-shell #appLoadingOverlay {
                display: grid;
            }
            #appLoadingOverlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 2147483640;
                place-content: center;
                justify-items: center;
                gap: 20px;
                background: #1e1e2e;
                color: #cdd6f4;
                font: 600 18px/1.5 system-ui, sans-serif;
                text-align: center;
            }
            .app-loading-track {
                width: min(300px, 76vw);
                height: 16px;
                border: 2px solid #585b70;
                background: #11111b;
                padding: 2px;
            }
            .app-loading-fill {
                display: block;
                height: 100%;
                width: 0%;
                background: #b4befe;
                transition: width 160ms linear;
            }
            @media (prefers-reduced-motion: reduce) {
                .app-loading-fill { transition: none; }
            }
        </style>
        <script>
            (() => {
                document.documentElement.classList.add("meditord-js");
                const build = document.querySelector('meta[name="meditord-build-id"]')?.content;
                let warm = false;
                try { warm = !!build && localStorage.getItem("meditord-shell-ready") === build; } catch {}
                if (!warm) document.documentElement.classList.add("meditord-cold-shell");
            })();
        </script>
        <script src="/js/app-shell.js" defer></script>
        <link rel="stylesheet" href="/css/global.css" />
        {{page_stylesheet}}
    </head>
    <body>
        <div id="appLoadingOverlay" role="status" aria-live="polite" aria-label="Loading application">
            <span>Loading...</span>
            <div class="app-loading-track" role="progressbar" aria-label="Application loading progress"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="app-loading-fill"></span>
            </div>
        </div>
        {{body}}
        <div
            class="app-dialog-overlay"
            id="appDialog"
            role="presentation"
            hidden
        >
            <section
                class="app-dialog-window raised"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="appDialogTitle"
                aria-describedby="appDialogMessage"
            >
                <header class="app-dialog-titlebar">
                    <h2 id="appDialogTitle">Message</h2>
                    <button
                        class="app-dialog-close"
                        id="appDialogClose"
                        type="button"
                        aria-label="Close dialog"
                    >×</button>
                </header>
                <div class="app-dialog-content">
                    <p id="appDialogMessage"></p>
                    <label class="app-dialog-input-wrap" id="appDialogInputWrap" hidden>
                        <span class="app-dialog-visually-hidden" id="appDialogInputLabel">Value</span>
                        <input id="appDialogInput" type="text" />
                    </label>
                    <div class="app-dialog-actions">
                        <button id="appDialogCancel" type="button">Cancel</button>
                        <button id="appDialogConfirm" type="button">OK</button>
                    </div>
                </div>
            </section>
        </div>
        <script>
            (() => {
                const buildId = document.querySelector(
                    'meta[name="meditord-build-id"]',
                )?.content;
                if (!buildId) return;

                try {
                    const key = "meditord_app_state";
                    const previous = JSON.parse(
                        localStorage.getItem(key) || "{}",
                    );
                    if (previous.buildId !== buildId) {
                        localStorage.setItem(
                            key,
                            JSON.stringify({ buildId }),
                        );
                    }
                } catch {}
            })();
        </script>
        <script src="/js/app-dialog.js"></script>
        <script>
            (() => {
                if (!("serviceWorker" in navigator) || !window.isSecureContext) {
                    return;
                }

                const buildId = document.querySelector(
                    'meta[name="meditord-build-id"]',
                )?.content;
                if (!buildId) return;

                // Register before window.load, which can wait on large post images.
                const scriptUrl = `/sw.js?v=${encodeURIComponent(buildId)}`;
                window.meditordServiceWorkerReady = navigator.serviceWorker
                    .register(scriptUrl, { scope: "/", updateViaCache: "none" })
                    .then(async registration => {
                        if (!registration.active?.scriptURL.endsWith(scriptUrl)) {
                            const installing = registration.installing || registration.waiting;
                            if (installing) {
                                await Promise.race([
                                    new Promise(resolve => {
                                        if (installing.state === "activated") return resolve();
                                        installing.addEventListener("statechange", () => {
                                            if (installing.state === "activated" || installing.state === "redundant") resolve();
                                        });
                                    }),
                                    new Promise(resolve => window.setTimeout(resolve, 2800)),
                                ]);
                            }
                        }
                        return registration;
                    })
                    .catch(() => null);
            })();
        </script>
        <script>
            (() => {
                const viewport = window.visualViewport;
                if (!viewport) return;

                let frame = 0;
                const syncViewport = () => {
                    if (frame) return;
                    frame = requestAnimationFrame(() => {
                        frame = 0;
                        const activeElement = document.activeElement;
                        const textInputFocused =
                            activeElement instanceof HTMLTextAreaElement ||
                            activeElement?.isContentEditable ||
                            (activeElement instanceof HTMLInputElement &&
                                ![
                                    "button",
                                    "checkbox",
                                    "file",
                                    "radio",
                                    "range",
                                    "reset",
                                    "submit",
                                ].includes(activeElement.type));
                        const rawOffset = Math.max(
                            0,
                            window.innerHeight -
                                (viewport.height + viewport.offsetTop),
                        );
                        const keyboardOffset =
                            textInputFocused && viewport.scale === 1
                                ? rawOffset
                                : 0;
                        const root = document.documentElement;
                        root.style.setProperty(
                            "--keyboard-offset",
                            `${keyboardOffset}px`,
                        );
                        root.style.setProperty(
                            "--visual-viewport-height",
                            `${viewport.height}px`,
                        );
                        root.classList.toggle(
                            "keyboard-visible",
                            keyboardOffset > 80,
                        );
                    });
                };

                syncViewport();
                viewport.addEventListener("resize", syncViewport, {
                    passive: true,
                });
                viewport.addEventListener("scroll", syncViewport, {
                    passive: true,
                });
                window.addEventListener("orientationchange", syncViewport, {
                    passive: true,
                });
                window.addEventListener("focusin", syncViewport);
                window.addEventListener("focusout", () => {
                    window.setTimeout(syncViewport, 0);
                });
            })();
        </script>
    </body>
</html>
