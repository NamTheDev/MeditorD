<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}}</title>
        <meta name="color-scheme" content="dark" />
        <meta name="darkreader-lock" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Montserrat:wght@600;700;800&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/global.css" />
    </head>
    <body>
        <div class="mobile-support-message" role="alert" aria-live="assertive">
            <div class="mobile-support-message__inner">
                <div class="mobile-support-message__title">Mobile is not supported.</div>
                <div class="mobile-support-message__text">Please access this app through desktop.</div>
            </div>
        </div>
        {{body}}
        <script>
            (() => {
                const isMobileDevice = () => {
                    const widthMatch = window.matchMedia("(max-width: 900px)").matches;
                    const pointerMatch = window.matchMedia("(pointer: coarse)").matches;
                    const userAgentMatch = /Android|iPhone|iPad|iPod|Mobile|mobile|Windows Phone/i.test(
                        navigator.userAgent,
                    );

                    return widthMatch || pointerMatch || userAgentMatch;
                };

                const applyMobileBlock = () => {
                    document.body.classList.toggle("mobile-blocked", isMobileDevice());
                };

                applyMobileBlock();
                window.addEventListener("resize", applyMobileBlock, { passive: true });
            })();
        </script>
    </body>
</html>
