<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <title>{{title}}</title>
        <meta name="meditord-build-id" content="{{build_id}}" />
        <link rel="icon" type="image/webp" href="/media/icon.webp" />
        <meta name="color-scheme" content="dark" />
        <meta name="darkreader-lock" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Montserrat:wght@600;700;800&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/global.css" />
        {{page_stylesheet}}
    </head>
    <body>
        {{body}}
        <div
            class="app-dialog-overlay"
            id="appDialog"
            role="presentation"
            hidden
        >
            <section
                class="app-dialog-window raised"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="appDialogTitle"
                aria-describedby="appDialogMessage"
            >
                <header class="app-dialog-titlebar">
                    <h2 id="appDialogTitle">Message</h2>
                    <button
                        class="app-dialog-close"
                        id="appDialogClose"
                        type="button"
                        aria-label="Close dialog"
                    >×</button>
                </header>
                <div class="app-dialog-content">
                    <p id="appDialogMessage"></p>
                    <label class="app-dialog-input-wrap" id="appDialogInputWrap" hidden>
                        <span class="app-dialog-visually-hidden" id="appDialogInputLabel">Value</span>
                        <input id="appDialogInput" type="text" />
                    </label>
                    <div class="app-dialog-actions">
                        <button id="appDialogCancel" type="button">Cancel</button>
                        <button id="appDialogConfirm" type="button">OK</button>
                    </div>
                </div>
            </section>
        </div>
        <script>
            (() => {
                const buildId = document.querySelector(
                    'meta[name="meditord-build-id"]',
                )?.content;
                if (!buildId) return;

                try {
                    const key = "meditord_app_state";
                    const previous = JSON.parse(
                        localStorage.getItem(key) || "{}",
                    );
                    if (previous.buildId !== buildId) {
                        localStorage.setItem(
                            key,
                            JSON.stringify({ buildId }),
                        );
                    }
                } catch {}
            })();
        </script>
        <script src="/js/app-dialog.js"></script>
        <script>
            (() => {
                const viewport = window.visualViewport;
                if (!viewport) return;

                let frame = 0;
                const syncViewport = () => {
                    if (frame) return;
                    frame = requestAnimationFrame(() => {
                        frame = 0;
                        const activeElement = document.activeElement;
                        const textInputFocused =
                            activeElement instanceof HTMLTextAreaElement ||
                            activeElement?.isContentEditable ||
                            (activeElement instanceof HTMLInputElement &&
                                ![
                                    "button",
                                    "checkbox",
                                    "file",
                                    "radio",
                                    "range",
                                    "reset",
                                    "submit",
                                ].includes(activeElement.type));
                        const rawOffset = Math.max(
                            0,
                            window.innerHeight -
                                (viewport.height + viewport.offsetTop),
                        );
                        const keyboardOffset =
                            textInputFocused && viewport.scale === 1
                                ? rawOffset
                                : 0;
                        const root = document.documentElement;
                        root.style.setProperty(
                            "--keyboard-offset",
                            `${keyboardOffset}px`,
                        );
                        root.style.setProperty(
                            "--visual-viewport-height",
                            `${viewport.height}px`,
                        );
                        root.classList.toggle(
                            "keyboard-visible",
                            keyboardOffset > 80,
                        );
                    });
                };

                syncViewport();
                viewport.addEventListener("resize", syncViewport, {
                    passive: true,
                });
                viewport.addEventListener("scroll", syncViewport, {
                    passive: true,
                });
                window.addEventListener("orientationchange", syncViewport, {
                    passive: true,
                });
                window.addEventListener("focusin", syncViewport);
                window.addEventListener("focusout", () => {
                    window.setTimeout(syncViewport, 0);
                });
            })();
        </script>
    </body>
</html>
