<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}}</title>
        <link rel="icon" type="image/webp" href="/media/icon.webp" />
        <meta name="color-scheme" content="dark" />
        <meta name="darkreader-lock" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Montserrat:wght@600;700;800&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/global.css" />
    </head>
    <body>
        <div class="mobile-support-message" role="alert" aria-live="assertive">
            <div class="mobile-support-message__inner">
                <div class="mobile-support-message__title">
                    Mobile is not supported.
                </div>
                <div class="mobile-support-message__text">
                    Please access this app through desktop.
                </div>
            </div>
        </div>
        {{body}}
        <div
            class="app-dialog-overlay"
            id="appDialog"
            role="presentation"
            hidden
        >
            <section
                class="app-dialog-window raised"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="appDialogTitle"
                aria-describedby="appDialogMessage"
            >
                <header class="app-dialog-titlebar">
                    <h2 id="appDialogTitle">Message</h2>
                    <button
                        class="app-dialog-close"
                        id="appDialogClose"
                        type="button"
                        aria-label="Close dialog"
                    >×</button>
                </header>
                <div class="app-dialog-content">
                    <p id="appDialogMessage"></p>
                    <label class="app-dialog-input-wrap" id="appDialogInputWrap" hidden>
                        <span class="app-dialog-visually-hidden" id="appDialogInputLabel">Value</span>
                        <input id="appDialogInput" type="text" />
                    </label>
                    <div class="app-dialog-actions">
                        <button id="appDialogCancel" type="button">Cancel</button>
                        <button id="appDialogConfirm" type="button">OK</button>
                    </div>
                </div>
            </section>
        </div>
        <script src="/js/app-dialog.js"></script>
        <script>
            (() => {
                const isMobileDevice = () => {
                    const widthMatch =
                        window.matchMedia("(max-width: 900px)").matches;
                    const pointerMatch =
                        window.matchMedia("(pointer: coarse)").matches;
                    const userAgentMatch =
                        /Android|iPhone|iPad|iPod|Mobile|mobile|Windows Phone/i.test(
                            navigator.userAgent,
                        );

                    return widthMatch || pointerMatch || userAgentMatch;
                };

                const applyMobileBlock = () => {
                    document.body.classList.toggle(
                        "mobile-blocked",
                        isMobileDevice(),
                    );
                };

                applyMobileBlock();
                window.addEventListener("resize", applyMobileBlock, {
                    passive: true,
                });
            })();
        </script>
    </body>
</html>
