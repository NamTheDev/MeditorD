<div id="databaseApp">
    <div class="database-workspace-frame">
    <header class="database-header">
        <div class="database-titlebar">
            <h1>DATABASE</h1>
            <span class="database-title-caption">POST MANAGER</span>
        </div>
        <nav class="database-actions" aria-label="Database actions">
            <div class="database-actions-left">
                <button id="backButton" type="button">Home</button>
                <button id="archiveButton" type="button">Archive</button>
            </div>
            <div class="database-actions-right">
                <button id="newFolderButton" type="button">New folder</button>
                <button id="newPostButton" type="button">New post</button>
                <button id="refreshButton" type="button">Refresh</button>
            </div>
        </nav>
    </header>

    <main class="database-main">
        <section class="database-searchbar" role="search" aria-label="Search, filter and sort entries">
            <div class="database-search-line">
                <label for="searchInput">Search:</label>
                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search posts and folders..."
                    autocomplete="off"
                />
                <output class="database-results-count" id="databaseResultCount" for="searchInput" aria-live="polite">Loading...</output>
            </div>
            <div class="database-filter-line">
                <label class="database-filter-control" for="databaseSearchMode">
                    <span>Match:</span>
                    <span class="win98-select">
                        <select id="databaseSearchMode">
                            <option value="includes">Contains</option>
                            <option value="starts">Starts with</option>
                            <option value="ends">Ends with</option>
                        </select>
                    </span>
                </label>
                <label class="database-filter-control" for="databaseSortOrder">
                    <span>Sort:</span>
                    <span class="win98-select">
                        <select id="databaseSortOrder">
                            <option value="newest">Date: Newest first</option>
                            <option value="oldest">Date: Oldest first</option>
                            <option value="az">Title: A–Z</option>
                            <option value="za">Title: Z–A</option>
                        </select>
                    </span>
                </label>
                <label class="database-filter-control" for="databaseFolderFilter">
                    <span>Folder:</span>
                    <span class="win98-select">
                        <select id="databaseFolderFilter">
                            <option value="">All folders</option>
                        </select>
                    </span>
                </label>
            </div>
        </section>
        <div class="table-wrap">
            <table aria-label="Saved posts and folders">
                <thead>
                    <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Username</th>
                        <th scope="col">URL</th>
                        <th scope="col">Folder</th>
                        <th scope="col">Created</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="databaseList">
                    <tr>
                        <td colspan="6">Loading database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    </div>
</div>

<div
    class="edit-modal hidden"
    id="editModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="editModalTitle"
>
    <form class="edit-modal-box" id="editForm">
        <div class="edit-modal-header">
            <h2 id="editModalTitle">Edit post</h2>
            <button
                class="modal-close"
                id="closeEditButton"
                type="button"
                aria-label="Close"
            >
                ×
            </button>
        </div>
        <label>Title<input id="editTitle" name="title" required /></label>
        <label>Folder<span class="win98-select"><select id="editFolder" name="folder"></select></span></label>
        <label>Username<input id="editUsername" name="username" /></label>
        <label>URL<input id="editUrl" name="url" type="url" /></label>
        <label
            >Created<input
                id="editCreatedAt"
                name="createdAt"
                type="datetime-local"
        /></label>
        <label
            >Media<input
                id="editMedia"
                name="media"
                type="file"
                accept="image/*,video/*"
        /></label>
        <label
            >Description<textarea
                id="editContent"
                name="content"
                rows="7"
            ></textarea>
        </label>
        <label class="remove-media"
            ><input id="removeMedia" name="removeMedia" type="checkbox" />
            Remove current media</label
        >
        <p class="modal-error" id="editError" role="alert"></p>
        <div class="edit-modal-actions">
            <button id="cancelEditButton" type="button">Cancel</button>
            <button type="submit">Save</button>
        </div>
    </form>
</div>

<link rel="stylesheet" href="/css/win98-scrollbars.css" />
<script src="/js/media-thumbnail.js" defer></script>
<script src="/js/database.js" defer></script>
