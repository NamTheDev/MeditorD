<div id="fullscreenApp">
    <div class="menu-bar">
        <button class="action-btn" id="backButton">HOME</button>
        <div class="gallery-title">GALLERY</div>
        <a class="action-btn" id="databaseButton" href="/database.html">DATABASE</a>
        <button class="action-btn" id="newPostButton">NEW SUBMISSION</button>
    </div>
    <div class="archive-explorer-layout">
      <aside class="archive-explorer-sidebar" aria-label="Archive folders">
        <div class="archive-explorer-heading">
          <span>EXPLORER</span>
          <button id="archiveNewFolderButton" class="archive-new-folder-button"
                  type="button" aria-label="Create folder" title="New folder">
            <span class="archive-folder-add-icon" aria-hidden="true">
              <span class="archive-folder-add-shape"></span>
              <span class="archive-folder-add-plus">+</span>
            </span>
          </button>
        </div>
        <nav id="archiveFolderTree" aria-label="Archive folder navigation"></nav>
      </aside>
      <div class="archive-explorer-main">
        <nav id="archiveBreadcrumbs" class="archive-breadcrumbs raised" aria-label="Folder location" data-current-folder="">
          <button type="button" data-archive-path="">All posts</button>
        </nav>
        <script>
          // Paint the bookmarked folder breadcrumb immediately, before the folder API responds.
          (() => {
            const folder = new URLSearchParams(window.location.search).get("folder") || "";
            if (!folder) return;
            const nav = document.getElementById("archiveBreadcrumbs");
            const fragment = document.createDocumentFragment();
            let path = "";
            const addButton = (label, destination) => {
              const button = document.createElement("button");
              button.type = "button";
              button.dataset.archivePath = destination;
              button.textContent = label;
              fragment.append(button);
            };
            addButton("All posts", "");
            for (const part of folder.split("/").filter(Boolean)) {
              path = path ? path + "/" + part : part;
              const separator = document.createElement("span");
              separator.textContent = " / ";
              fragment.append(separator);
              addButton(part, path);
            }
            nav.replaceChildren(fragment);
            nav.dataset.currentFolder = folder;
          })();
        </script>
    <div class="archive-search-toolbar raised" role="search" aria-label="Search and sort posts">
      <label class="archive-search-input">
        <span>Search:</span>
        <input id="archiveSearchInput" type="search" placeholder="Search..." autocomplete="off" />
      </label>
      <label class="archive-search-select">
        <span>Match:</span>
        <span class="win98-select">
        <select id="archiveSearchMode">
          <option value="includes">Contains</option>
          <option value="starts">Starts with</option>
          <option value="ends">Ends with</option>
        </select>
        </span>
      </label>
      <label class="archive-search-select">
        <span>Sort:</span>
        <span class="win98-select">
        <select id="archiveSortOrder">
          <option value="newest">Date: Newest first</option>
          <option value="oldest">Date: Oldest first</option>
          <option value="az">Title: A–Z</option>
          <option value="za">Title: Z–A</option>
        </select>
        </span>
      </label>
    </div>
    <div class="gallery-viewport sunken" id="galleryViewport">
        <div class="reddit-gallery" id="postsContainer">{{archive_posts}}</div>
        <script id="initialPosts" type="application/json">
            {{archive_posts_json}}
        </script>
    </div>
      </div>
    </div>
</div>
<div id="archiveFolderContextMenu" class="card-menu archive-folder-context-menu" role="menu" aria-label="Folder actions" hidden>
  <button type="button" role="menuitem" data-folder-action="new-folder">New folder</button>
  <button type="button" role="menuitem" data-folder-action="new-subfolder">New subfolder</button>
  <button type="button" role="menuitem" data-folder-action="new-post">New post here</button>
  <button type="button" role="menuitem" data-folder-action="delete-folder">Delete folder</button>
</div>
<div class="modal-overlay" id="postModal">
    <div class="modal-window raised">
        <div class="title-bar">
            <span id="modalTitle">POST INSPECTOR</span>
            <button
                class="modal-close-button"
                type="button"
                aria-label="Close post inspector"
                title="Close"
            >
                ✕
            </button>
        </div>
        <div class="modal-content-area sunken" id="modalBody"></div>
    </div>
</div>
<script src="/js/media-thumbnail.js" defer></script>
<script src="/js/post-sharing.js" defer></script>
<script src="/js/archive-utils.js" defer></script>
<script src="/js/archive.js" defer></script>
